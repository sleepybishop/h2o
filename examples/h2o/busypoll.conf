# This example expects interface 2 to have two RX queues and CPUs 1, 2 and 3
# to be available. Adjust these values for the host before starting H2O.
listen: 8080
tcp-reuseport: ON
num-threads: [2, 3, 1]
busy-poll-usecs: 50
busy-poll-map:
  interfaces:
    - ifindex: 2
      cpus: [2, 3]  # RX queues 0 and 1, respectively
      options:
        mode: BUSYPOLL

# Worker 2, pinned to CPU 1, serves other interfaces including loopback.
hosts:
  default:
    paths:
      /:
        file.dir: examples/doc_root
    access-log:
      path: /dev/stdout
      format: '%h "%r" %s %b %{bp.iface}x %{bp.napi-id}x %{bp.cpu-idx}x %{thread-index}x'
